services:

  mongodb:
    image: mongo:8
    container_name: mongodb-agendador
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: db_agendador

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - agendador-network


  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-agendador
    restart: unless-stopped

    depends_on:
      - mongodb

    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin

      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123

    ports:
      - "8082:8081"

    networks:
      - agendador-network


  agendador-tarefas:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agendador-tarefas
    restart: unless-stopped

    depends_on:
      - mongodb

    environment:
      SPRING_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/db_agendador?authSource=admin
      SERVER_PORT: 8081

    ports:
      - "8081:8081"

    networks:
      - agendador-network


volumes:
  mongodb_data:

networks:
  agendador-network:
    driver: bridge